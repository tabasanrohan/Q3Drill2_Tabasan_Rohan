<body>
    <h1>Solve for the Quotient</h1>
    <br>

        <details class="ontoggle">
            <summary>Introduction</summary>
            <p id="instruct"></p>
        </details>
    <form action="#">
        <label for="num1">Enter first number</label>
        <input type="number" id="num1" class="form-control" placeholder="Dividend" required>

        <br>
        
                <label for="number2">Enter second number</label>
        <input type="number" id="num2" class="form-control" placeholder="Divisor" required>

        <br>
        <button type="submit" class="btn btn-success" onmouseover="calculate()">Calculate</button>

    </form>
    <script>
             document.getElementById('instruct').innerHTML="Enter two numbers and calculate.";

        function calculate(){
            var num1 = document.getElementById('num1').value;
            var num2 = document.getElementById('num2').value;
            var sum = Number(num1) / Number(num2);
            var compare = Number(num1) == Number(num2);

            alert("The quotient is: " + sum + "\n" + "Is the Dividend equal to the dvisor? " + compare); //concatenation

        }
    </script>
